<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c302e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chiky Gym · Mi rutina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#f3f5f2;--bg2:#e1e6e1;--card:#fffffff0;--card-s:#fff;
  --ink:#2c302e;--muted:#474a48;--line:#909590;
  --pink:#537a5a;--pink-d:#2c302e;--pink-l:#9ae19d;--rose:#f2f4f2;
  --ok:#537a5a;--warn:#e9eee9;
  --shadow:0 8px 22px #2c302e18;
  --nav-h:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font:500 16px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:linear-gradient(170deg,var(--bg1),var(--bg2)) fixed;
  padding:env(safe-area-inset-top,0px) 0 calc(var(--nav-h) + 92px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink-d);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding:14px 14px 0}
h1,h2,h3,p{margin:0}
.brand{font-family:Pacifico,"Brush Script MT",cursive;font-size:38px;line-height:1.15;color:var(--pink-d);text-shadow:0 2px 0 #fff}
.sub{color:var(--muted);font-size:14px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 2px 12px}
.card{background:var(--card);border:1.5px solid #fff;border-radius:5px;padding:14px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.card+.card,.card+h2,h2+.card{margin-top:12px}
h2{font-size:18px;font-weight:800;margin:18px 4px 8px}
h2:first-child{margin-top:4px}
.av{border-radius:5px;display:block;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 12px #2c302e22;background:var(--pink-l)}
.avbtn{border:0;background:none;padding:0;border-radius:5px}

.clock{display:flex;align-items:center;gap:14px}
.clock .t{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums;color:var(--pink-d)}
.clock .d{font-weight:800;font-size:15px;text-transform:capitalize}
.clock .z{font-size:12px;color:var(--muted);font-weight:700}

.ring{--p:0;width:92px;height:92px;border-radius:5px;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--pink) calc(var(--p)*1%),var(--pink-l) 0)}
.ring b{width:72px;height:72px;border-radius:5px;background:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;color:var(--pink-d)}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1;min-width:0}
.pill{display:inline-block;border-radius:5px;padding:3px 10px;font-size:12px;font-weight:800;background:var(--pink-l);color:var(--pink-d)}
.pill.sw2{background:var(--rose);color:var(--muted)}
.stats{display:grid;gap:4px;font-size:14px;font-weight:700}
.stats span{color:var(--muted);font-weight:600}

.btn{border:0;border-radius:5px;padding:13px 16px;font-weight:800;background:linear-gradient(180deg,var(--pink),#474a48);color:#fff;box-shadow:0 6px 14px #537a5a33;width:100%;display:block;text-align:center;text-decoration:none}
.btn.sec{background:#fff;color:var(--pink-d);border:1.5px solid var(--line);box-shadow:none}
.btn.sm{width:auto;padding:9px 13px;font-size:14px;border-radius:5px;display:inline-block}
.link{border:0;background:none;color:var(--pink-d);font-weight:800;font-size:13px;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.strip div{text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding:6px 0;border-radius:5px;background:var(--rose)}
.strip div i{display:block;font-style:normal;font-size:17px;margin-top:2px;min-height:24px;line-height:24px}
.strip .today{outline:2.5px solid var(--pink);background:#fff;color:var(--pink-d)}
.strip .done i{color:var(--ok)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:5px;padding:9px 15px;font-weight:800;white-space:nowrap;flex:none}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.bar{height:9px;border-radius:5px;background:var(--pink-l);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--pink-d));border-radius:5px;transition:width .25s}

.note{background:var(--warn);border-radius:5px;padding:11px 13px;font-size:14px;margin-top:12px}
.note b{color:var(--pink-d)}

.ex{background:var(--card-s);border:1.5px solid var(--line);border-radius:5px;padding:14px;margin-top:10px;box-shadow:var(--shadow)}
.ex.ok{background:#eff9ef;border-color:var(--pink-l)}
.ex-h{display:flex;gap:12px;align-items:center}
.ex-art{width:96px;height:96px;flex:none;overflow:hidden;border:1px solid var(--line);border-radius:5px;background:var(--rose)}
.ex-art img{display:block;width:100%;height:100%;object-fit:cover}
.ex-copy{flex:1;min-width:0}
.ex-pills{display:flex;gap:4px;flex-wrap:wrap}
.ex h3{font-size:16px;font-weight:800;line-height:1.25}
.ex-copy .target{margin-top:7px;white-space:normal}
.ex p{font-size:13.5px;color:var(--muted);margin-top:6px}
.target{font-weight:800;color:var(--pink-d);font-size:14px;white-space:nowrap}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.set{width:48px;height:48px;border-radius:5px;border:2px solid var(--line);background:var(--rose);font-weight:800;font-size:16px;color:var(--pink-d)}
.set.on{background:var(--ok);border-color:var(--ok);color:#fff}
.meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px}
.kg{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--muted)}
.kg input,.fld input,.fld select,.fld textarea{padding:10px 11px;border:1.5px solid var(--line);border-radius:5px;background:var(--rose);font-weight:700;width:100%}
.kg input{width:84px;text-align:center}
.prev{font-size:12px;color:var(--muted);font-weight:700}
.rests{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:700}
.rests button{border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:5px;padding:6px 8px;font-size:12px;font-weight:800}
.rests button.on{border-color:var(--pink);color:var(--pink-d);background:var(--pink-l)}
.acts{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}
.win{background:linear-gradient(180deg,#eff9ef,#dff2e0);border:1.5px solid var(--pink-l);border-radius:5px;padding:14px;margin-top:14px;text-align:center;font-weight:800}

.tbl{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left;font-weight:700}
th{color:var(--muted);font-weight:800}
.chart{width:100%;height:auto;display:block}
.inl{display:flex;gap:8px;margin-top:10px}
.inl input{flex:1;min-width:0;padding:11px 12px;border:1.5px solid var(--line);border-radius:5px;background:var(--rose);font-weight:700}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.kv div{background:var(--rose);border-radius:5px;padding:9px 4px}
.kv b{display:block;font-size:17px;color:var(--pink-d)}
.kv span{font-size:11.5px;color:var(--muted);font-weight:700}
.up{color:var(--ok)!important}.dn{color:#b3261e!important}
ul.clean{margin:8px 0 0;padding-left:20px;font-size:14.5px}
ul.clean li{margin:4px 0}
.fld{display:block;margin-top:10px;font-size:13px;font-weight:800;color:var(--muted)}
.fld input,.fld select,.fld textarea{margin-top:4px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* calendario */
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calh b{font-size:17px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dw{text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.cell{aspect-ratio:1;border-radius:5px;border:0;background:var(--rose);display:grid;place-items:center;align-content:center;font-weight:800;font-size:13px;padding:0;color:var(--ink);line-height:1.1}
.cell i{font-style:normal;font-size:13px;min-height:16px;color:var(--pink)}
.cell.e{background:none}
.cell.done{background:#eff9ef}.cell.done i{color:var(--ok);font-weight:800}
.cell.plan{background:#fff;border:1.5px solid var(--line)}
.cell.miss i{color:var(--muted)}
.cell.today{outline:2.5px solid var(--pink-d)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted);margin-top:10px}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:#2c302e99;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:#f8faf8;border-radius:5px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0}
.sheet .x{float:right;border:0;background:var(--pink-l);color:var(--pink-d);width:36px;height:36px;border-radius:5px;font-size:18px;font-weight:800}
.steps{margin:8px 0 0;padding-left:22px;font-size:15px}
.steps li{margin:6px 0}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:5px;padding:12px;margin-top:8px}
.opt.on{border-color:var(--pink);background:var(--pink-l)}
.opt b{display:block}
.opt span{font-size:13px;color:var(--muted);font-weight:600}
.hist{font-size:13px;margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.hist span{background:var(--rose);border-radius:5px;padding:4px 8px;font-weight:700}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:10px 16px;border-radius:5px;font-weight:800;font-size:14px;box-shadow:0 8px 20px #0003;max-width:90vw;text-align:center}
.toast[hidden]{display:none}

/* temporizador */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:20;padding:0 12px 8px}
.timer-in{max-width:616px;margin:0 auto;background:linear-gradient(180deg,var(--pink),#474a48);color:#fff;border-radius:5px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 26px #2c302e44}
.timer.run .timer-in{background:linear-gradient(180deg,#474a48,#2c302e)}
.tring{--p:0;width:50px;height:50px;border-radius:5px;flex:none;display:grid;place-items:center;background:conic-gradient(#fff calc(var(--p)*1%),#ffffff44 0)}
.tring b{width:38px;height:38px;border-radius:5px;background:var(--pink-d);display:grid;place-items:center;font-size:11px}
.tclock{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.tlab{font-size:12px;opacity:.9;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{border:0;border-radius:5px;background:#fff;color:var(--pink-d);font-weight:800;padding:10px 12px;font-size:14px}
.tbtn.g{background:#ffffff33;color:#fff}
.timer.done .timer-in{animation:pulse .7s 3}
@keyframes pulse{50%{transform:scale(1.025)}}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fffffff0;border-top:1.5px solid var(--line);
  padding:0 4px env(safe-area-inset-bottom,0px);display:flex;justify-content:center}
nav .in{display:flex;max-width:640px;width:100%;height:var(--nav-h)}
nav button{flex:1;border:0;background:none;color:var(--muted);font-size:11px;font-weight:800;display:grid;place-items:center;align-content:center;gap:2px;min-width:0}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pink-d)}
@media(min-width:700px){.app{padding-top:24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<div class="timer" id="timer">
  <div class="timer-in">
    <div class="tring" id="tring"><b>⏱</b></div>
    <div class="grow"><div class="tclock" id="tclock">01:00</div><div class="tlab" id="tlab">Temporizador de descanso</div></div>
    <button class="tbtn g" id="tminus" aria-label="Restar 15 segundos">−15</button>
    <button class="tbtn g" id="tplus" aria-label="Sumar 15 segundos">+15</button>
    <button class="tbtn" id="tmain">Iniciar</button>
  </div>
</div>

<nav><div class="in" id="nav"></div></nav>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============ DATOS ============ */
const TZ = "America/Bogota";
const DAYS = [
 {n:"Espalda + bíceps + abdomen", short:"Espalda y bíceps", tag:"Fuerza y postura",
  intro:"Calienta 8 min en bicicleta suave + 1 serie ligera del primer ejercicio. Pecho abierto, hombros lejos de las orejas.",
  ex:[
   ["Jalón al pecho","Espalda",3,"10–12",60,1,"Lleva la barra a la parte alta del pecho; no te balancees."],

   ["Remo con mancuerna con mano apoyada en banco","Espalda",3,"10–12 por lado",60,0,"Espalda neutra; el codo viaja hacia la cadera."],
   ["Face pull en polea","Postura",3,"12–15",45,0,"Tira hacia la cara con codos abiertos; pausa de 1 s."],
   ["Curl de bíceps con mancuernas","Bíceps",3,"10–12",45,0,"Codos pegados al cuerpo, sin impulso."],
   ["Curl martillo","Bíceps",2,"12",45,0,"Palmas enfrentadas, muñecas neutras."],
   ["Dead bug","Abdomen",3,"8 por lado",30,0,"Zona lumbar pegada al suelo mientras alternas brazo y pierna."],
   ["Pallof press en polea","Abdomen",3,"10 por lado",30,0,"Empuja al frente sin que el tronco rote."],
   ["Plancha en antebrazos","Abdomen",3,"20–40 s",30,0,"Cuerpo en línea, abdomen firme, glúteos activos."]
  ]},
 {n:"Glúteos + piernas + estabilidad", short:"Glúteos y piernas", tag:"Piernas amigables con rodillas",
  intro:"Calienta 8 min en bicicleta + movilidad de cadera. Rango cómodo: si una rodilla molesta, reduce el recorrido o cambia de ejercicio.",
  ex:[
   ["Hip thrust en máquina o banco","Glúteos",3,"10–12",75,1,"Sube sin arquear la espalda y pausa 1 s arriba."],
   ["Peso muerto rumano con mancuernas","Femoral",3,"10",75,1,"Cadera atrás, espalda neutra, rodillas ligeramente flexionadas."],
   ["Prensa de piernas (rango corto)","Piernas",3,"12",75,0,"Pies altos en la plataforma y no bajes de unos 70° de rodilla."],
   ["Curl femoral sentado","Femoral",3,"12",60,0,"Regresa despacio, cadera pegada al asiento."],
   ["Abducción de cadera en máquina","Glúteos",3,"15",45,0,"Abre sin rebotes ni impulso."],
   ["Patada de glúteo en polea","Glúteos",3,"12 por lado",45,0,"Movimiento corto; no arquees la espalda baja."],
   ["Bird dog","Estabilidad",3,"8 por lado",30,0,"Pelvis quieta al extender brazo y pierna contrarios."],
   ["Plancha lateral (rodillas apoyadas)","Estabilidad",3,"20–30 s por lado",30,0,"Hombro, cadera y rodillas alineados."]
  ]},
 {n:"Espalda + hombros + tríceps", short:"Espalda y hombros", tag:"Fuerza y resistencia",
  intro:"Calienta 8 min y haz rotaciones de hombro con banda o sin peso. Prioriza el control de escápulas.",
  ex:[
   ["Remo con pecho apoyado","Espalda",3,"10–12",60,1,"Pecho apoyado, codos hacia atrás sin encoger hombros."],
   ["Jalón agarre neutro","Espalda",3,"10–12",60,1,"Baja los codos hacia las costillas sin echarte atrás."],
   ["Pájaros en máquina (reverse pec deck)","Postura",3,"12–15",45,0,"Poco peso, hombros abajo, abre con control."],
   ["Press de hombros con mancuernas sentada","Hombros",3,"10",60,0,"Costillas abajo y abdomen firme; sin arquear."],
   ["Elevaciones laterales","Hombros",3,"12–15",45,0,"Sube hasta la altura del hombro, sin impulso."],
   ["Extensión de tríceps en polea","Tríceps",3,"10–12",45,0,"Codos pegados al cuerpo."],
   ["Tríceps con cuerda sobre la cabeza","Tríceps",2,"12",45,0,"Omite si molesta el hombro."],
   ["Leñador en polea (diagonal)","Abdomen",3,"10 por lado",30,0,"Gira desde el tronco, con brazos casi rectos y abdomen firme."]
  ]},
 {n:"Brazos + espalda + cardio", short:"Brazos y espalda", tag:"Resistencia cardiovascular",
  intro:"Día de volumen moderado. Evita llegar al fallo en todas las series y termina con cardio suave.",
  ex:[
   ["Remo unilateral en polea","Espalda",3,"10 por lado",60,1,"Tronco estable, codo hacia la cadera."],
   ["Pullover en polea","Espalda",3,"12",45,0,"Brazos casi rectos; siente el dorsal trabajar."],
   ["Curl de bíceps en polea","Bíceps",3,"12",45,0,"No adelantes los codos."],
   ["Curl martillo con cuerda","Bíceps",2,"12",45,0,"Muñecas neutras, movimiento controlado."],
   ["Tríceps con cuerda","Tríceps",3,"12",45,0,"Separa suavemente los extremos al extender."],
   ["Face pull ligero","Postura",3,"15",30,0,"Hombros lejos de las orejas al terminar."],
   ["Crunch inverso en banco","Abdomen",3,"12",30,0,"Sube la pelvis con control, sin balancear."],
   ["Cardio: elíptica o bicicleta (ritmo moderado)","Cardio",1,"10 min",0,0,"Marca la serie al terminar; respiración cómoda."]
  ]}
];
const WEEKS = {
 1:["Adaptación","Aprende la técnica. Deja unas 3 repeticiones en reserva (RIR 3)."],
 2:["Base","Sube un poco el peso si todo sale fácil. Deja unas 2 repeticiones en reserva (RIR 2)."],
 3:["Progresión","Una serie extra en los ejercicios principales ★. Deja 1–2 repeticiones en reserva."],
 4:["Descarga","Una serie menos y 10–15 % menos de peso para recuperar y consolidar."]
};
const PLAN_WD = {0:0,1:1,3:2,4:3};
const WD_LAB = ["L","M","X","J","V","S","D"];

/* Alternativas por molestia (rodilla, cadera u otra) */
const ALT = {
 "Jalón al pecho":[["Jalón agarre neutro","Palmas enfrentadas: más cómodo para el hombro."],["Jalón a una mano en polea","Trabaja cada lado por separado con menos carga."]],
 "Remo sentado en polea":[["Remo en máquina con pecho apoyado","Sin carga en la zona lumbar ni en la cadera."],["Remo con banda elástica de pie","Menos carga articular y fácil de dosificar."]],
 "Remo con mancuerna con mano apoyada en banco":[["Remo inclinado con pecho en banco","Pecho apoyado en un banco inclinado: descarga la espalda baja."],["Remo en máquina con pecho apoyado","Trayectoria guiada y estable."]],
 "Face pull en polea":[["Pájaros en máquina","Misma zona de postura, con el pecho apoyado."],["Retracción escapular en polea","Tira de los omóplatos hacia atrás con brazos casi rectos."]],
 "Curl de bíceps con mancuernas":[["Curl en polea baja","Tensión constante y mejor control."],["Curl con barra Z","Agarre más cómodo para las muñecas."]],
 "Curl martillo":[["Curl martillo sentada en banco con respaldo","Sin carga en rodillas ni cadera."],["Curl martillo con cuerda en polea","Tensión constante y menos balanceo."]],
 "Dead bug":[["Dead bug solo con talones","Mueve solo las piernas para proteger la zona lumbar."],["Elevación alterna de pierna tumbada","Espalda baja pegada al suelo, un lado a la vez."]],
 "Pallof press en polea":[["Pallof press sentada en banco","Sin cargar las rodillas."],["Press isométrico con banda","Banda a la altura del pecho; sostén 15–20 s."]],
 "Plancha en antebrazos":[["Plancha inclinada con manos en banco","Menos carga en hombros y sin apoyar las rodillas."],["Hollow hold con piernas flexionadas","Tumbada, lumbar pegada; sostén 15–25 s."]],

/* ============ FECHAS (Colombia) ============ */
function bogota(){
  const d=new Date();
  const f=(o,l="es-CO")=>new Intl.DateTimeFormat(l,{timeZone:TZ,...o}).format(d);
  const wk=f({weekday:"short"},"en-US");
  return {iso:f({},"en-CA"),
    date:f({weekday:"long",day:"numeric",month:"long",year:"numeric"}),
    time:f({hour:"2-digit",minute:"2-digit",hourCycle:"h23"}),
    wd:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(wk)};
}
const dayMs=864e5;
const toUTC=iso=>Date.parse(iso+"T00:00:00Z");
const addDays=(iso,n)=>new Date(toUTC(iso)+n*dayMs).toISOString().slice(0,10);
const wdOf=iso=>(new Date(toUTC(iso)).getUTCDay()+6)%7;
function mondayOf(iso){return addDays(iso,-wdOf(iso))}
function weekOf(iso){return Math.floor((toUTC(iso)-toUTC(state.start))/(7*dayMs))+1}
const pad=n=>String(n).padStart(2,"0");
function monthLabel(ym){const [y,m]=ym.split("-").map(Number);return new Intl.DateTimeFormat("es-CO",{timeZone:"UTC",month:"long",year:"numeric"}).format(new Date(Date.UTC(y,m-1,1)))}
function addMonth(ym,n){const [y,m]=ym.split("-").map(Number);const d=new Date(Date.UTC(y,m-1+n,1));return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}`}
function shortDate(iso){return new Intl.DateTimeFormat("es-CO",{timeZone:"UTC",day:"numeric",month:"short"}).format(new Date(toUTC(iso)))}
if(!state.start){state.start=mondayOf(bogota().iso);state.week=1;save()}
function currentWeek(){return Math.min(4,Math.max(1,weekOf(bogota().iso)))}
if(!state.weekInit){state.week=currentWeek();state.weekInit=true;save()}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kx=(w,d,e)=>`${w}-${d}-${e}`;
const P=()=>state.profile;
function setsFor(ex,w){
  const b=ex[2];
  if(b===1)return 1;
  if(w===3&&ex[5])return b+1;
  if(w===4)return Math.max(2,b-1);
  return b;
}
function exInfo(d,i){
  const ex=DAYS[d].ex[i],sw=state.swap[`${d}-${i}`];
  const alt=(sw!==undefined&&ALT[ex[0]]&&ALT[ex[0]][sw])?ALT[ex[0]][sw]:null;
  return {d,i,base:ex[0],name:alt?alt[0]:ex[0],tip:alt?alt[1]:ex[6],how:alt?null:HOW[ex[0]],group:ex[1],sets:ex[2],reps:ex[3],rest:ex[4],main:ex[5],alt:!!alt};
}
function lookup(name){
  for(let d=0;d<DAYS.length;d++)for(let i=0;i<DAYS[d].ex.length;i++){
    const ex=DAYS[d].ex[i];
    if(ex[0]===name)return {d,i,base:name,name,tip:ex[6],how:HOW[name],group:ex[1],sets:ex[2],reps:ex[3],rest:ex[4],main:ex[5],alt:false};
    const a=(ALT[ex[0]]||[]).find(x=>x[0]===name);
    if(a)return {d,i,base:ex[0],name,tip:a[1],how:null,group:ex[1],sets:ex[2],reps:ex[3],rest:ex[4],main:ex[5],alt:true};
  }
  return null;
}
function dayProgress(w,d){
  let t=0,c=0;
  DAYS[d].ex.forEach((ex,i)=>{const s=setsFor(ex,w);t+=s;c+=Math.min(s,+state.done[kx(w,d,i)]||0)});
  return {t,c,p:t?Math.round(c/t*100):0};
}
function weekProgress(w){let t=0,c=0;DAYS.forEach((_,d)=>{const x=dayProgress(w,d);t+=x.t;c+=x.c});return {t,c,p:t?Math.round(c/t*100):0}}
function planProgress(){let t=0,c=0;[1,2,3,4].forEach(w=>{const x=weekProgress(w);t+=x.t;c+=x.c});return {t,c,p:t?Math.round(c/t*100):0}}
function sessionsDone(w){return DAYS.filter((_,d)=>state.log[`${w}-${d}`]).length}
function syncLog(w,d){
  const k=`${w}-${d}`,{t,c}=dayProgress(w,d);
  if(t&&c>=t){if(!state.log[k])state.log[k]=bogota().iso}else delete state.log[k];
}
function sessionsList(){

  return [...state.past,...cur];
}

}
function pctChange(name){const a=state.hist[name]||[];if(a.length<2)return null;return (a[a.length-1].kg/a[0].kg-1)*100}
function strengthTotal(){
  const v=Object.keys(state.hist).map(pctChange).filter(x=>x!==null);
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;

function strengthMonth(ym){

    if(m.length&&a.length>1)v.push((Math.max(...m.map(e=>e.kg))/a[0].kg-1)*100);
  });

/* ============ TEMPORIZADOR ============ */
const T={total:60,end:0,left:60,run:false,iv:null,ctx:null,label:""};
function beep(){
  try{
    T.ctx=T.ctx||new (window.AudioContext||window.webkitAudioContext)();
    [0,.22,.44].forEach(t=>{
      const o=T.ctx.createOscillator(),g=T.ctx.createGain();
      o.frequency.value=t>.4?1040:780;o.connect(g);g.connect(T.ctx.destination);
      g.gain.setValueAtTime(.18,T.ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,T.ctx.currentTime+t+.18);
      o.start(T.ctx.currentTime+t);o.stop(T.ctx.currentTime+t+.2);
    });
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}
}
const mmss=s=>`${pad(Math.floor(s/60))}:${pad(s%60)}`;
function drawTimer(){
  $("tclock").textContent=mmss(Math.max(0,T.left));
  $("tring").style.setProperty("--p",T.total?(T.left/T.total*100):0);
  $("tmain").textContent=T.run?"Pausa":(T.left<T.total&&T.left>0?"Seguir":"Iniciar");
  $("tlab").textContent=T.run?`Descansando${T.label?" · "+T.label:""}`:(T.left===0?"¡Listo, siguiente serie!":"Temporizador de descanso");
  $("timer").classList.toggle("run",T.run);
}
function tick(){
  T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));drawTimer();
  if(T.left<=0){
    clearInterval(T.iv);T.run=false;drawTimer();beep();
    const el=$("timer");el.classList.remove("done");void el.offsetWidth;el.classList.add("done");
  }
}
function startTimer(sec,label){
  clearInterval(T.iv);T.label=label||"";T.total=sec;T.left=sec;T.end=Date.now()+sec*1000;T.run=true;
  T.iv=setInterval(tick,250);drawTimer();
  try{T.ctx=T.ctx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
}
function pauseTimer(){clearInterval(T.iv);T.run=false;drawTimer()}
function resumeTimer(){T.end=Date.now()+T.left*1000;T.run=true;clearInterval(T.iv);T.iv=setInterval(tick,250);drawTimer()}
function adjustTimer(d){
  T.left=Math.max(0,T.left+d);if(T.left>T.total)T.total=T.left;
  if(T.run)T.end=Date.now()+T.left*1000;
  drawTimer();
}
$("tmain").onclick=()=>{
  if(T.run)pauseTimer();
  else if(T.left>0&&T.left<T.total)resumeTimer();
  else startTimer(T.total||60,T.label);
};

/* ============ GRÁFICOS Y AVATAR ============ */
function lineChart(pts,unit,label){
  if(pts.length<2)return `<p class="sub" style="margin-top:8px">Registra al menos dos pesajes para ver la gráfica.</p>`;
  const W=320,H=140,Pd=26,vals=pts.map(p=>p.v),mn=Math.floor(Math.min(...vals)-1),mx=Math.ceil(Math.max(...vals)+1);
  const x=i=>Pd+(W-2*Pd)*i/(pts.length-1),y=v=>H-Pd-(H-2*Pd)*(v-mn)/(mx-mn||1);
  const path=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4" fill="var(--pink)"/>`).join("");
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    <text x="4" y="${y(mx)+4}" font-size="10" fill="var(--muted)">${mx}</text><text x="4" y="${y(mn)+4}" font-size="10" fill="var(--muted)">${mn}</text>
    <line x1="${Pd}" x2="${W-Pd}" y1="${y(mn)}" y2="${y(mn)}" stroke="var(--line)"/><line x1="${Pd}" x2="${W-Pd}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--line)"/>
    <path d="${path}" fill="none" stroke="var(--pink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}
    <text x="${x(pts.length-1)}" y="${y(last.v)-10}" font-size="11" font-weight="800" fill="var(--pink-d)" text-anchor="end">${last.v} ${unit}</text></svg>`;
}
function spark(vals){
  if(vals.length<2)return "";
  const W=70,H=26,mn=Math.min(...vals),mx=Math.max(...vals);
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*(W-4)+2).toFixed(1)},${(H-3-(H-6)*(v-mn)/((mx-mn)||1)).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--pink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function muscleSVG(group){
  const r=REG[group]||[],h=k=>r.includes(k)?"var(--pink)":"#9ae19d",b="var(--pink-l)";
  const front=`<g><circle cx="50" cy="14" r="10" fill="${b}"/><rect x="34" y="32" width="32" height="70" rx="12" fill="${b}"/>
   <ellipse cx="30" cy="40" rx="9" ry="8" fill="${h("shoulder")}"/><ellipse cx="70" cy="40" rx="9" ry="8" fill="${h("shoulder")}"/>
   <rect x="19" y="48" width="9" height="28" rx="4" fill="${h("biceps")}"/><rect x="72" y="48" width="9" height="28" rx="4" fill="${h("biceps")}"/>
   <rect x="17" y="78" width="9" height="30" rx="4" fill="${b}"/><rect x="74" y="78" width="9" height="30" rx="4" fill="${b}"/>
   <rect x="42" y="60" width="16" height="36" rx="6" fill="${h("abs")}"/>
   <rect x="34" y="104" width="14" height="46" rx="6" fill="${h("quads")}"/><rect x="52" y="104" width="14" height="46" rx="6" fill="${h("quads")}"/>
   <rect x="35" y="152" width="12" height="38" rx="5" fill="${b}"/><rect x="53" y="152" width="12" height="38" rx="5" fill="${b}"/></g>`;
  const back=`<g transform="translate(120 0)"><circle cx="50" cy="14" r="10" fill="${b}"/><rect x="34" y="32" width="32" height="70" rx="12" fill="${b}"/>
   <ellipse cx="30" cy="40" rx="9" ry="8" fill="${h("shoulder")}"/><ellipse cx="70" cy="40" rx="9" ry="8" fill="${h("shoulder")}"/>
   <path d="M38 36 L62 36 L66 74 L34 74Z" fill="${h("back")}"/>
   <rect x="19" y="48" width="9" height="28" rx="4" fill="${h("triceps")}"/><rect x="72" y="48" width="9" height="28" rx="4" fill="${h("triceps")}"/>
   <rect x="17" y="78" width="9" height="30" rx="4" fill="${b}"/><rect x="74" y="78" width="9" height="30" rx="4" fill="${b}"/>
   <ellipse cx="41" cy="97" rx="10" ry="9" fill="${h("glutes")}"/><ellipse cx="59" cy="97" rx="10" ry="9" fill="${h("glutes")}"/>
   <rect x="34" y="110" width="14" height="40" rx="6" fill="${h("hams")}"/><rect x="52" y="110" width="14" height="40" rx="6" fill="${h("hams")}"/>
   <rect x="35" y="152" width="12" height="38" rx="5" fill="${b}"/><rect x="53" y="152" width="12" height="38" rx="5" fill="${b}"/></g>`;
  return `<svg viewBox="0 0 220 200" style="width:100%;max-width:240px;height:auto;display:block;margin:8px auto 0" role="img" aria-label="Músculos que trabaja: ${esc(group)}">${front}${back}
   <text x="50" y="199" font-size="9" fill="var(--muted)" text-anchor="middle" font-weight="700">Frente</text><text x="170" y="199" font-size="9" fill="var(--muted)" text-anchor="middle" font-weight="700">Espalda</text></svg>`;
}
function exerciseSlug(name){
  return name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function exerciseArt(name){
  const src=`img/ejercicios/${exerciseSlug(name)}.jpg`;
  return `<div class="ex-art"><img src="${src}" alt="Imagen de ${esc(name)}" onerror="this.onerror=null;this.src='img/exercise-generic.jpg'" loading="lazy"></div>`;
}
function avatarHTML(size){
  const a=state.avatar;
  const photo=a.photo||"img/ProfilePhoto.png";
  return `<img class="av" src="${photo}" width="${size}" height="${size}" style="width:${size}px;height:${size}px" alt="Foto de perfil">`;
}

  const q=encodeURIComponent(info.name+" técnica ejercicio gimnasio");

  openModal(`<button class="x" data-close aria-label="Cerrar">✕</button>
   <h2 style="margin-right:44px">${esc(info.name)}</h2>
   <div style="margin-top:6px"><span class="pill">${esc(info.group)}</span> ${info.alt?`<span class="pill sw2">Alternativa</span>`:""} <span class="pill">${info.sets} × ${esc(info.reps)}${info.rest?` · descanso ${info.rest} s`:""}</span></div>
   ${muscleSVG(info.group)}

   ${info.how?`<div class="note"><b>Error común:</b> ${esc(info.how[1])}</div>`:""}
   <div class="note" style="background:var(--rose)"><b>Consejo:</b> ${esc(info.tip)}</div>
   <h3 style="font-size:16px;margin-top:14px">Historial de pesos${pc!==null?` · <span class="${cls(pc)}">${fmtPct(pc)}</span>`:""}</h3>
   ${hist.length?`${lineChart(hist.map(e=>({v:e.kg})),"kg","Evolución de peso en "+info.name)}<div class="hist">${[...hist].reverse().slice(0,8).map(e=>`<span>${shortDate(e.d)} · ${e.kg} kg</span>`).join("")}</div>`:`<p class="sub" style="margin-top:6px">Aún no hay pesos registrados. Anótalos en la tarjeta del ejercicio.</p>`}
   <div class="row" style="margin-top:14px"><a class="btn sm grow" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${q}">▶ Ver video</a><a class="btn sec sm grow" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${q}">🖼 Ver imágenes</a></div>
   <p class="sub" style="margin-top:8px;font-size:12px">Los videos e imágenes se abren en YouTube y Google. Compara la técnica con varias referencias.</p>
   ${info.d!==undefined?`<button class="btn sec" style="margin-top:10px" data-swapfrom="${info.d}-${info.i}">¿Molestia? Cambiar ejercicio</button>`:""}`);
  document.querySelectorAll("[data-swapfrom]").forEach(b=>b.onclick=()=>{const [d,i]=b.dataset.swapfrom.split("-").map(Number);swapModal(d,i)});
}
let zone="rodilla";
function swapModal(d,i){
  const ex=DAYS[d].ex[i],alts=ALT[ex[0]]||[],sw=state.swap[`${d}-${i}`];
  openModal(`<button class="x" data-close aria-label="Cerrar">✕</button>
   <h2 style="margin-right:44px">Cambiar ejercicio</h2>
   <p class="sub" style="margin-top:4px">${esc(ex[0])}</p>
   <div class="chips" style="margin-top:10px">${[["rodilla","Rodilla"],["cadera","Cadera"],["otra","Otra molestia"]].map(([k,l])=>`<button class="chip ${zone===k?"on":""}" data-zone="${k}">${l}</button>`).join("")}</div>
   <div class="note" style="margin-top:0">${esc(ZONES[zone])}<br><br>Si el dolor es intenso o persiste, deja de entrenar esa zona y consulta con un profesional.</div>
   <button class="opt ${sw===undefined?"on":""}" data-pick="-1"><b>${esc(ex[0])}</b><span>Ejercicio original del plan</span></button>
   ${alts.map((a,j)=>`<button class="opt ${sw===j?"on":""}" data-pick="${j}"><b>${esc(a[0])}</b><span>${esc(a[1])}</span></button>`).join("")}
   <p class="sub" style="margin-top:10px;font-size:12px">El cambio se aplica a las 4 semanas. Mantiene las mismas series, repeticiones y descanso.</p>`);
  document.querySelectorAll("[data-zone]").forEach(b=>b.onclick=()=>{zone=b.dataset.zone;swapModal(d,i)});
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    const j=+b.dataset.pick,key=`${d}-${i}`;
    if(j<0)delete state.swap[key];else state.swap[key]=j;
    for(let w=state.week;w<=4;w++)delete state.kg[kx(w,d,i)];
    save();closeModal();render();toast(j<0?"Ejercicio original restaurado":"Ejercicio cambiado");
  });
}

function viewCal(){
  const now=bogota();if(!state.calMonth)state.calMonth=now.iso.slice(0,7);
  const ym=state.calMonth,[Y,M]=ym.split("-").map(Number);
  const dow=wdOf(`${ym}-01`),dim=new Date(Date.UTC(Y,M,0)).getUTCDate();
  const ss=sessionsList(),by={};ss.forEach(s=>(by[s.date]=by[s.date]||[]).push(s));
  let cells=WD_LAB.map(l=>`<div class="dw">${l}</div>`).join("");
  for(let i=0;i<dow;i++)cells+=`<div class="cell e"></div>`;
  for(let n=1;n<=dim;n++){
    const iso=`${ym}-${pad(n)}`,wdi=(dow+n-1)%7,w=weekOf(iso),planned=(wdi in PLAN_WD)&&w>=1&&w<=4,d=PLAN_WD[wdi];
    const dn=by[iso],t=iso===now.iso?" today":"";
    if(dn)cells+=`<div class="cell done${t}" title="Entrenado">${n}<i>✓ ${dn.map(s=>"D"+(s.day+1)).join(",")}</i></div>`;
    else if(planned&&iso>=now.iso)cells+=`<button class="cell plan${t}" data-cgo="${d}-${w}" aria-label="Día ${d+1} programado el ${n}">${n}<i>D${d+1}</i></button>`;
    else if(planned&&!state.log[`${w}-${d}`])cells+=`<div class="cell miss${t}" title="Sin completar">${n}<i>–</i></div>`;
    else cells+=`<div class="cell${t}">${n}<i></i></div>`;
  }
  const inMonth=ss.filter(s=>s.date.startsWith(ym)).length;
  const weeks=[1,2,3,4].map(w=>{
    const x=weekProgress(w),a=addDays(state.start,(w-1)*7);
    return `<div style="margin-top:10px"><div class="row" style="justify-content:space-between"><b>Semana ${w}</b><span class="sub">${shortDate(a)} – ${shortDate(addDays(a,6))} · ${sessionsDone(w)}/4 sesiones</span></div><div class="bar" style="margin-top:5px"><i style="width:${Math.round(sessionsDone(w)/4*100)}%"></i></div><div class="sub" style="font-size:12px;margin-top:3px">Cumplimiento ${Math.round(sessionsDone(w)/4*100)}% · series ${x.p}%</div></div>`;
  }).join("");
  return `
  <div class="top"><div><h1 style="font-size:24px;font-weight:800">Calendario</h1><div class="sub">Tus entrenamientos y cumplimiento</div></div></div>
  <div class="card">
    <div class="calh"><button class="chip" data-cm="-1" aria-label="Mes anterior">‹</button><b>${monthLabel(ym)}</b><button class="chip" data-cm="1" aria-label="Mes siguiente">›</button></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span>✓ Entrenado</span><span style="color:var(--pink)">● Programado (toca para ir)</span><span>– Sin completar</span></div>
    <p class="sub" style="margin-top:8px"><b>${inMonth}</b> ${inMonth===1?"sesión":"sesiones"} en este mes.</p>
  </div>
  <h2>Cumplimiento semanal</h2>
  <div class="card">${weeks.replace(/^<div style="margin-top:10px">/,"<div>")}</div>`;
}

function progGen(){
  const pp=planProgress();

  const hist=[...bodySorted()].reverse().slice(0,5).map(b=>`<tr><td>${shortDate(b.date)}</td><td>${b.kg} kg</td></tr>`).join("");
  const st=strengthTotal(),kg=lastBody();
  return `
  <div class="card"><div class="row"><div class="ring" style="--p:${pp.p}"><b>${pp.p}%</b></div>
    <div class="grow stats"><div>${pp.c} de ${pp.t} <span>series totales</span></div><div>${[1,2,3,4].reduce((a,w)=>a+sessionsDone(w),0)} de 16 <span>sesiones</span></div><div class="${cls(st)}">${fmtPct(st)} <span>fuerza total</span></div></div></div>
    ${weeks}</div>
  <h2>Peso corporal</h2>
  <div class="card">
    ${lineChart(bodySorted().slice(-12).map(b=>({v:b.kg})),"kg","Evolución del peso corporal")}
    <div class="inl"><input id="bkg" type="text" inputmode="decimal" placeholder="Hoy: ${kg} kg" aria-label="Peso corporal de hoy"><button class="btn sm" id="addBody">Guardar</button></div>
    ${hist?`<div class="tbl"><table><tbody>${hist}</tbody></table></div>`:""}
    <div class="kv" style="margin-top:12px"><div><b>${kg}</b><span>kg</span></div><div><b>${P().cm}</b><span>cm</span></div><div><b>${imc()}</b><span>IMC</span></div><div><b>${P().age}</b><span>años</span></div></div>
  </div>`;
}
function progStr(){
  const names=[];
  DAYS.forEach(D=>D.ex.forEach(ex=>{[ex[0],...(ALT[ex[0]]||[]).map(a=>a[0])].forEach(n=>{if(state.hist[n]&&!names.includes(n))names.push(n)})}));
  Object.keys(state.hist).forEach(n=>{if(!names.includes(n))names.push(n)});
  const st=strengthTotal();
  const list=names.map(n=>{
    const a=state.hist[n],pc=pctChange(n);
    return `<button class="opt" data-ficha="${esc(n)}" style="display:flex;align-items:center;gap:10px"><span class="grow" style="display:block"><b>${esc(n)}</b><span>${a[0].kg} → ${a[a.length-1].kg} kg · ${a.length} ${a.length===1?"registro":"registros"}</span></span>${spark(a.map(e=>e.kg))}<b class="${cls(pc)}" style="min-width:52px;text-align:right">${fmtPct(pc)}</b></button>`;
  }).join("");
  return `<div class="card"><div class="row"><div class="ring" style="--p:${st===null?0:Math.min(100,Math.max(0,st*4))}"><b class="${cls(st)}" style="font-size:17px">${fmtPct(st)}</b></div>
   <div class="grow"><b>Fuerza total</b><p class="sub">Promedio del cambio de peso en tus ejercicios frente al primer registro. Necesitas al menos dos registros por ejercicio.</p></div></div></div>
   <h2>Historial por ejercicio</h2>
   ${list||`<div class="card"><p class="sub">Aún no hay pesos registrados. Escribe el peso en cada ejercicio de tu rutina y aquí verás si estás ganando fuerza.</p></div>`}`;
}
function progMon(){
  const set=new Set([bogota().iso.slice(0,7)]);
  sessionsList().forEach(s=>set.add(s.date.slice(0,7)));
  state.body.forEach(b=>set.add(b.date.slice(0,7)));
  Object.keys(state.cnt).forEach(d=>set.add(d.slice(0,7)));
  Object.values(state.hist).forEach(a=>a.forEach(e=>set.add(e.d.slice(0,7))));
  const months=[...set].sort().reverse(),bs=bodySorted();
  const cards=months.map(ym=>{
    const ses=sessionsList().filter(s=>s.date.startsWith(ym)).length;
    const sets=Object.entries(state.cnt).filter(([d])=>d.startsWith(ym)).reduce((a,[,v])=>a+v,0);
    const inM=bs.filter(b=>b.date.startsWith(ym)),before=bs.filter(b=>b.date<ym+"-01");
    const kg=inM.length?inM[inM.length-1].kg:null,base=before.length?before[before.length-1].kg:P().kg0;
    const dk=kg!==null?+(kg-base).toFixed(1):null,sm=strengthMonth(ym);
    return `<div class="card"><b style="text-transform:capitalize;font-size:17px">${monthLabel(ym)}</b>
      <div class="kv" style="margin-top:8px"><div><b>${ses}</b><span>sesiones</span></div><div><b>${sets}</b><span>series</span></div><div><b>${kg!==null?kg:"–"}</b><span>kg${dk!==null&&dk!==0?` (${dk>0?"+":""}${dk})`:""}</span></div><div><b class="${cls(sm)}">${fmtPct(sm)}</b><span>fuerza</span></div></div></div>`;
  }).join("");
  return `<p class="sub" style="margin:0 4px 8px">Resumen por mes: sesiones completadas, series, peso corporal al cierre y cambio de fuerza frente a tu primer registro.</p>${cards}`;
}

/* ============ SINCRONIZACIÓN ============ */
const SKEY="chikyGymSync";
sync={code:null,last:0,msg:"",busy:false,t:null};
try{sync.code=localStorage.getItem(SKEY)||null}catch(e){}
function setSyncMsg(m){sync.msg=m;const e=$("syncMsg");if(e)e.textContent=syncLine()}
function syncLine(){
  const t=sync.last?new Intl.DateTimeFormat("es-CO",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date(sync.last)):"";
  return (sync.msg||"")+(t&&!/^Sincronizando/.test(sync.msg||"")?` · última vez ${t}`:"");
}
function schedulePush(){if(!sync||!sync.code)return;clearTimeout(sync.t);sync.t=setTimeout(()=>syncNow(),2500)}
async function syncApi(method,body){
  const r=await fetch("/api/sync",{method,headers:{"X-Sync-Code":sync.code,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"});
  if(r.status===401)throw new Error("code");
  if(!r.ok)throw new Error("na");
  try{return await r.json()}catch(e){throw new Error("na")}
}
function syncErr(e){
  if(e&&e.message==="code")return "El código no es válido (mínimo 8 caracteres).";
  if(e&&e.message==="na")return "La sincronización no está disponible en esta dirección.";
  return "Sin conexión. Se sincronizará cuando vuelva internet.";
}
function applyRemote(r){
  const d=r.data;
  SYNC_FIELDS.forEach(k=>{if(d[k]!==undefined)state[k]=d[k]});
  state.profile={...DEF.profile,...state.profile};state.avatar={...DEF.avatar,...state.avatar};
  state.rev=r.rev;state.week=currentWeek();lastFp=JSON.stringify(snapshot());
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
}
function safeRender(){const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName||"")))render()}
async function syncNow(){
  if(!sync.code||sync.busy)return;
  sync.busy=true;setSyncMsg("Sincronizando…");
  try{
    const r=await syncApi("GET"),mine=state.rev||0;
    if(r.data&&(r.rev||0)>mine){applyRemote(r);sync.last=Date.now();setSyncMsg("Datos actualizados desde la nube");safeRender()}
    else if(mine>(r.rev||0)){await syncApi("PUT",{rev:mine,data:snapshot()});sync.last=Date.now();setSyncMsg("Guardado en la nube")}
    else{sync.last=Date.now();setSyncMsg("Todo al día")}
  }catch(e){setSyncMsg(syncErr(e))}
  sync.busy=false;
}
async function linkCode(code){
  code=(code||"").trim();
  if(code.length<8)return toast("El código debe tener al menos 8 caracteres");
  const prev=sync.code;sync.code=code;
  try{
    const r=await syncApi("GET"),mine=state.rev||0;
    if(r.data){
      if(!mine||confirm("Ya hay datos guardados en la nube con este código.\n\nAceptar: usar los datos de la nube (se reemplazan los de este dispositivo).\nCancelar: conservar los de este dispositivo y reemplazar los de la nube.")){applyRemote(r);sync.msg="Datos descargados de la nube"}
      else{state.rev=Date.now();await syncApi("PUT",{rev:state.rev,data:snapshot()});sync.msg="Guardado en la nube"}
    }else{state.rev=Date.now();await syncApi("PUT",{rev:state.rev,data:snapshot()});sync.msg="Sincronización activada"}
    try{localStorage.setItem(SKEY,code)}catch(e){}
    sync.last=Date.now();save();state.view="me";render();toast("Sincronización activada");
  }catch(e){sync.code=prev;toast(syncErr(e))}
}
function genCode(){
  const al="abcdefghjkmnpqrstuvwxyz23456789",a=new Uint8Array(12);crypto.getRandomValues(a);
  const c=[...a].map(x=>al[x%al.length]).join("");return `rosa-${c.slice(0,4)}-${c.slice(4,8)}-${c.slice(8,12)}`;
}
(function(){
  const m=/^#c=(.+)$/.exec(location.hash||"");
  if(m){let c="";try{c=decodeURIComponent(m[1])}catch(e){}
    try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
    if(c.length>=8&&c!==sync.code)setTimeout(()=>linkCode(c),400)}
})();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncNow()});
window.addEventListener("online",()=>syncNow());

/* ============ RENDER ============ */
function render(){
  const y=window.scrollY;
  $("app").innerHTML={home:viewHome,plan:viewPlan,cal:viewCal,prog:viewProg,me:viewMe}[state.view]();
  drawNav();bind();window.scrollTo(0,y);
}
function photoFrom(file){
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{
    const s=Math.min(img.width,img.height),c=document.createElement("canvas");c.width=c.height=240;
    c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,240,240);
    state.avatar.photo=c.toDataURL("image/jpeg",.82);state.avatar.mode="photo";save();render();toast("Foto actualizada");
  };img.onerror=()=>toast("No se pudo leer la imagen");img.src=r.result};
  r.readAsDataURL(file);
}
function newCycle(){
  Object.entries(state.log).forEach(([k,date])=>{const [w,d]=k.split("-").map(Number);state.past.push({date,day:d,week:w})});
  state.done={};state.kg={};state.rest={};state.log={};
  state.start=mondayOf(bogota().iso);state.week=1;state.day=0;
}
function bind(){
  const q=(s,f)=>document.querySelectorAll(s).forEach(f);
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
  q("[data-v2]",b=>b.onclick=()=>{state.view=b.dataset.v2;save();render();window.scrollTo(0,0)});
  q("[data-go]",b=>b.onclick=()=>{state.day=+b.dataset.go;state.week=+b.dataset.gw;state.view="plan";save();render();window.scrollTo(0,0)});
  q("[data-cgo]",b=>b.onclick=()=>{const [d,w]=b.dataset.cgo.split("-").map(Number);state.day=d;state.week=w;state.view="plan";save();render();window.scrollTo(0,0)});
  q("[data-cm]",b=>b.onclick=()=>{state.calMonth=addMonth(state.calMonth,+b.dataset.cm);save();render()});
  q("[data-pt]",b=>b.onclick=()=>{state.progTab=b.dataset.pt;save();render()});
  q("[data-week]",b=>b.onclick=()=>{state.week=+b.dataset.week;save();render()});
  q("[data-day]",b=>b.onclick=()=>{state.day=+b.dataset.day;save();render()});
  q("[data-info]",b=>b.onclick=()=>fichaModal(exInfo(state.day,+b.dataset.info)));
  q("[data-swap]",b=>b.onclick=()=>swapModal(state.day,+b.dataset.swap));
  q("[data-ficha]",b=>b.onclick=()=>{const n=b.dataset.ficha,l=lookup(n);fichaModal(l||{name:n,tip:"Ejercicio registrado en tu historial.",how:null,group:"Espalda",sets:"",reps:"",rest:0,alt:false})});
  q("[data-set]",b=>b.onclick=()=>{
    const i=+b.dataset.set,n=+b.dataset.n,k=kx(state.week,state.day,i),cur=+state.done[k]||0,ex=DAYS[state.day].ex[i];
    const nv=cur===n?n-1:n;state.done[k]=nv;
    const iso=bogota().iso;state.cnt[iso]=Math.max(0,(state.cnt[iso]||0)+(nv-cur));
    syncLog(state.week,state.day);save();render();
    if(nv>cur&&state.auto){
      const rs=state.rest[k]??ex[4];
      if(rs&&nv<setsFor(ex,state.week))startTimer(rs,exInfo(state.day,i).name);
    }
  });
  q("[data-kg]",inp=>inp.onchange=()=>{
    const i=+inp.dataset.kg,v=inp.value.trim().replace(",",".");
    state.kg[kx(state.week,state.day,i)]=v;
    setHist(exInfo(state.day,i).name,state.week,v);save();
  });
  q("[data-rest]",b=>b.onclick=()=>{state.rest[kx(state.week,state.day,+b.dataset.rest)]=+b.dataset.s;save();render()});
  const f=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
  const ta=()=>{state.auto=!state.auto;save();render();toast(state.auto?"Descanso automático activado":"Descanso automático desactivado")};
  f("autoT",ta);f("autoT2",ta);
  f("resetDay",()=>{if(confirm("¿Reiniciar las series marcadas de este día y semana?")){
    DAYS[state.day].ex.forEach((_,i)=>delete state.done[kx(state.week,state.day,i)]);
    delete state.log[`${state.week}-${state.day}`];save();render()}});
  f("addBody",()=>{
    const v=parseFloat(($("bkg").value||"").replace(",","."));
    if(!(v>25&&v<250)){$("bkg").focus();toast("Escribe un peso válido en kg");return}
    const iso=bogota().iso;state.body=state.body.filter(b=>b.date!==iso);state.body.push({date:iso,kg:Math.round(v*10)/10});save();render();toast("Peso guardado");
  });
  f("pickPhoto",()=>$("photo").click());
  const ph=$("photo");if(ph)ph.onchange=()=>{if(ph.files[0])photoFrom(ph.files[0])};
  f("saveProfile",()=>{
    const age=parseInt($("f_age").value,10),cm=parseInt($("f_cm").value,10),kg=parseFloat(($("f_kg").value||"").replace(",","."));
    if(!(age>=12&&age<=100))return toast("Revisa la edad");
    if(!(cm>=120&&cm<=220))return toast("Revisa la estatura (en cm)");
    if(!(kg>25&&kg<250))return toast("Revisa el peso (en kg)");
    Object.assign(state.profile,{name:$("f_name").value.trim()||"Chiky",age,cm,goal:$("f_goal").value.trim(),level:$("f_level").value,limits:$("f_limits").value.trim(),material:$("f_mat").value.trim()});
    if(kg!==lastBody()){const iso=bogota().iso;state.body=state.body.filter(b=>b.date!==iso);state.body.push({date:iso,kg:Math.round(kg*10)/10})}
    save();render();toast("Datos guardados");
  });
  f("restart",()=>{if(confirm("¿Empezar un nuevo ciclo de 4 semanas desde esta semana? Se limpian las series y pesos del ciclo actual, pero se conservan tu historial, calendario y peso corporal.")){newCycle();save();render();toast("Nuevo ciclo iniciado")}});
  f("syncOn",()=>linkCode($("f_code").value));
  f("genCode",()=>{$("f_code").value=genCode()});
  f("syncNowBtn",()=>syncNow());
  f("syncOff",()=>{if(confirm("¿Desactivar la sincronización en este dispositivo? Los datos en la nube no se borran.")){sync.code=null;try{localStorage.removeItem(SKEY)}catch(e){}render();toast("Sincronización desactivada")}});
  f("copyLink",()=>{
    const link=`${location.origin}${location.pathname}#c=${encodeURIComponent(sync.code)}`;
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(link).then(()=>toast("Enlace copiado"),()=>prompt("Copia este enlace:",link));
    else prompt("Copia este enlace:",link);
  });
  f("clearSwap",()=>{state.swap={};save();render();toast("Ejercicios originales restaurados")});
  f("exp",()=>{
    const blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`chiky-gym-${bogota().iso}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  });
  f("imp",()=>$("file").click());
  const fi=$("file");if(fi)fi.onchange=()=>{
    const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(typeof o!=="object"||!o.done)throw 0;
      state={...state,...o,profile:{...state.profile,...(o.profile||{})},avatar:{...state.avatar,...(o.avatar||{})},view:"me"};save();render();toast("Copia importada")}catch(e){toast("El archivo no es una copia válida de Chiky Gym")}};
    if(fi.files[0])r.readAsText(fi.files[0]);
  };
  f("wipe",()=>{if(confirm("¿Borrar todo tu registro en este dispositivo? Esto también desactiva la sincronización aquí; la copia en la nube no se borra. No se puede deshacer.")){try{localStorage.removeItem(KEY);localStorage.removeItem(SKEY)}catch(e){}location.reload()}});
}

setInterval(()=>{const h=$("hm");if(h){const n=bogota();h.textContent=n.time;$("dt").textContent=n.date}},1000);
drawTimer();render();
